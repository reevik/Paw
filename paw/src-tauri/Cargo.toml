[package]
name = "paw"
version = "0.6.0"
edition = "2021"
rust-version = "1.97.1"
description = "Orchestrate multiple agent processes in a native macOS window"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
portable-pty = "0.9"
tauri-plugin-dialog = "2"
base64 = "0.22"
rig-core = { version = "0.46.0", features = ["reqwest"] }
rig-agent = "0.46.0"
rig-tools = "0.46.0"
rig-reqwest = "0.46.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "net", "io-util"] }
futures = "0.3"
security-framework = "3"
rmcp = { version = "3.10", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
toml_edit = "0.22"
http = "1"
rig-rmcp = "0.46.0"

[dev-dependencies]
rig-core = { version = "0.46.0", features = ["reqwest", "test-utils"] }
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
