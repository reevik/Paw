<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Paw</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="about.css" />
</head>
<body class="about-win">
  <div class="drag" data-tauri-drag-region></div>

  <!-- Home -->
  <main class="view" id="v-home">
    <div class="hero">
      <img class="app-icon" src="icon.png" alt="" draggable="false" />
      <h1>Paw</h1>
      <p class="version" id="version">Version 0.1.0</p>
      <p class="tagline">Coding agents side by side, in one native window.</p>
    </div>
    <nav class="links">
      <button class="link-row" data-go="license">
        <span class="ico">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0L7 7Zm10 0-3 7a3 3 0 0 0 6 0l-3-7ZM8 21h8"/></svg>
        </span>
        <span class="txt"><b>MIT License</b><small>Paw is free and open source</small></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="link-row" data-go="oss">
        <span class="ico">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21Z"/></svg>
        </span>
        <span class="txt"><b>Open Source Projects</b><small id="oss-count">The projects Paw is built on, and their licenses</small></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </nav>
    <footer class="foot">
      <span>© 2026 Erhan Bağdemir</span>
      <span id="built-with">Built with Tauri and Rig</span>
    </footer>
  </main>

  <!-- MIT License -->
  <section class="view sub" id="v-license" hidden>
    <header class="bar">
      <button class="back" data-go="home"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>About</button>
      <h2>MIT License</h2>
    </header>
    <div class="scroll">
      <pre class="license" id="license-text" data-i18n>Loading…</pre>
    </div>
  </section>

  <!-- Open source projects -->
  <section class="view sub" id="v-oss" hidden>
    <header class="bar">
      <button class="back" data-go="home"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>About</button>
      <h2>Open Source Projects</h2>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Search projects or licenses" spellcheck="false" autocomplete="off" />
    </div>
    <div class="scroll" id="oss-list"></div>
  </section>

  <script src="i18n.js"></script>
  <script src="i18n/de/app.js"></script>
  <script src="i18n/de/tasks.js"></script>
  <script src="i18n/de/factories.js"></script>
  <script src="i18n/de/prefs.js"></script>
  <script src="i18n/de/misc.js"></script>
  <script src="i18n/tr/app.js"></script>
  <script src="i18n/tr/tasks.js"></script>
  <script src="i18n/tr/factories.js"></script>
  <script src="i18n/tr/prefs.js"></script>
  <script src="i18n/tr/misc.js"></script>
  <script src="about.js"></script>
</body>
</html>
