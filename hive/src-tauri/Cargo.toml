[package]
name = "hive"
version = "0.1.0"
edition = "2021"
description = "Orchestrate multiple agent processes in a native macOS window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
portable-pty = "0.9"
tauri-plugin-dialog = "2"
base64 = "0.22"
