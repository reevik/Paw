<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paw</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar: sits on the native vibrancy material -->
    <aside class="sidebar">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <!-- Specs, Factories and Tasks: cards like the skills' -->
      <div class="sidebar-section nav">
        <section class="sk-sec nav-sec" data-sec="specs">
          <div class="sk-sec-head" data-sec-toggle>
            <svg class="sk-chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
            <span class="sk-sec-title">Specs</span>
            <span class="sk-count" id="specs-count"></span>
            <button id="specs-add" class="sk-sec-add" title="Import specs (Markdown files) into a group">+</button>
          </div>
          <div class="sk-sec-body">
            <input id="specs-filter" class="skills-filter nav-filter" data-nav-filter="specs" placeholder="Filter specs" spellcheck="false" autocomplete="off" />
            <form id="specs-add-row" class="skills-add hidden" autocomplete="off">
              <input id="specs-group" list="specs-groups" placeholder="Group (new or existing)" spellcheck="false" />
              <datalist id="specs-groups"></datalist>
              <div class="skills-add-btns">
                <button type="button" id="specs-add-cancel">Cancel</button>
                <button type="submit" class="primary">Choose Files…</button>
              </div>
            </form>
            <div id="specs-msg" class="skills-msg hidden"></div>
            <div id="specs-body"></div>
          </div>
        </section>
        <section class="sk-sec nav-sec" data-sec="factories">
          <div class="sk-sec-head" data-sec-toggle>
            <svg class="sk-chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
            <span class="sk-sec-title">Factories</span>
            <span class="sk-count" id="factories-count"></span>
            <button id="factories-add" class="sk-sec-add" title="New factory">+</button>
          </div>
          <div class="sk-sec-body">
            <input id="factories-filter" class="skills-filter nav-filter" data-nav-filter="factories" placeholder="Filter factories" spellcheck="false" autocomplete="off" />
            <div id="factories-body"><div class="sk-empty">No factories yet.</div></div>
          </div>
        </section>
        <section class="sk-sec nav-sec" data-sec="sessions">
          <div class="sk-sec-head" data-sec-toggle>
            <svg class="sk-chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
            <span class="sk-sec-title">Sessions</span>
            <span class="sk-count" id="sessions-count"></span>
          </div>
          <div class="sk-sec-body">
            <input id="sessions-filter" class="skills-filter nav-filter" data-nav-filter="sessions" placeholder="Filter sessions" spellcheck="false" autocomplete="off" />
            <div id="sessions-body"></div>
          </div>
        </section>
      </div>
      <div class="sidebar-footer">
        <button id="settings-btn" class="btn-gear" title="Settings (⌘,)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" title="Drag to resize · double-click to reset"></div>

    <!-- Main pane -->
    <main class="main">
      <div class="tabbar" data-tauri-drag-region>
        <div id="tabs" class="tabs"></div>
        <div class="tab-new">
          <button id="tab-add" class="tab-add" title="New session with the default model (⌘T)">+</button>
          <button id="tab-menu" class="tab-chev" title="New session with…">
            <svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
          </button>
        </div>
        <div class="tab-tools">
          <button id="split-v" class="tab-tool" title="Split vertically — side by side (⌘D)">
            <svg viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="3"/><path d="M10 1v14"/></svg>
          </button>
          <button id="split-h" class="tab-tool" title="Split horizontally — stacked (⌘⇧D)">
            <svg viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="3"/><path d="M1 8h18"/></svg>
          </button>
          <button id="sidebar-toggle" class="sidebar-toggle tab-tool" title="Hide sidebar (⌃⌘S)">
            <svg viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="3"/><path d="M7 1v14"/><path class="fill" d="M3 4.5h2M3 7h2M3 9.5h2"/></svg>
          </button>
          <button id="panel-toggle" class="tab-tool" title="MCP servers and skills (⌃⌘M)">
            <svg viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="3"/><path d="M13 1v14"/><path class="fill" d="M15 4.5h2M15 7h2M15 9.5h2"/></svg>
          </button>
        </div>
      </div>

      <section id="welcome" class="welcome">
        <div class="welcome-card">
          <div class="logo"></div>
          <h1>Paw</h1>
          <p>Open a session and start typing — like a terminal tab, one agent per tab.</p>
          <div id="welcome-agents" class="welcome-agents"></div>
          <p class="hint-keys"><kbd>⌘T</kbd> new session · <kbd>⌘,</kbd> settings</p>
        </div>
      </section>

      <div id="panes" class="panes hidden"></div>
    </main>

    <!-- Right panel: the focused session's MCP servers, and skills -->
    <div id="panel-resizer" class="sidebar-resizer hidden" title="Drag to resize · double-click to reset"></div>
    <aside id="right-panel" class="right-panel hidden">
      <div class="panel-top" data-tauri-drag-region></div>
      <div class="panel-head">
        <div class="panel-tabs" id="panel-tabs" role="tablist">
          <button type="button" role="tab" data-tab="mcp">MCPs</button>
          <button type="button" role="tab" data-tab="skills">Skills</button>
        </div>
        <span class="sk-grow"></span>
        <button id="panel-close" class="sk-icon" title="Hide (⌃⌘M)">
          <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <section class="panel-pane" data-pane="mcp" role="tabpanel">
        <!-- The tab names the list; the head says whose servers they are. -->
        <div class="mcp-head">
          <div id="mcp-sub" class="mcp-sub"></div>
          <button id="mcp-add" class="sk-icon hidden" title="Add an MCP server">
            <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
          </button>
          <button id="mcp-refresh" class="sk-icon" title="Read the config again">
            <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
        </div>
        <div id="mcp-msg" class="skills-msg hidden"></div>
        <div id="mcp-body" class="mcp-body"></div>
      </section>
      <!-- Skills: what the agents load here, and the catalogue to add more from -->
      <section class="panel-pane skills-panel hidden" data-pane="skills" role="tabpanel">
        <div class="skills-head">
          <input id="skills-filter" class="skills-filter" placeholder="Filter skills" spellcheck="false" autocomplete="off" />
          <button id="skills-refresh" class="sk-icon" title="Scan again">
            <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
          <button id="skills-add" class="sk-icon" title="Add a catalogue of skills (folder or Git repository)">
            <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
          </button>
        </div>
        <div id="skills-add-row" class="skills-add hidden">
          <input id="skills-add-input" placeholder="Git URL or folder path" spellcheck="false" autocomplete="off" />
          <div class="skills-add-btns">
            <button id="skills-add-folder">Choose Folder…</button>
            <button id="skills-add-go" class="primary">Add</button>
          </div>
        </div>
        <div id="skills-msg" class="skills-msg hidden"></div>
        <div id="skills-body" class="skills-body"></div>
      </section>
    </aside>
  </div>

  <template id="pane-template">
      <section class="session pane" data-id="session">
        <div data-id="terminal" class="terminal">
          <div data-id="task-view" class="task-view hidden"></div>
          <div data-id="task-split" class="tk-split hidden" title="Drag to resize · double-click to reset"></div>
          <!-- A task tab's lower half: the planner's stream, or the timeline of its steps -->
          <div data-id="task-lower" class="tk-lower hidden">
            <div class="tk-views" role="tablist">
              <button type="button" class="tk-viewbtn on" data-lower="stream" role="tab">Stream</button>
              <button type="button" class="tk-viewbtn" data-lower="timeline" role="tab">Timeline</button>
            </div>
          </div>
          <div data-id="task-timeline" class="tk-timeline hidden"></div>
          <div data-id="output" class="output"></div>
          <div data-id="xterm-wrap" class="xterm-wrap">
            <div class="xterm-bar">
              <span class="xterm-dot"></span><span data-id="xterm-title">Terminal</span>
              <span class="grow"></span>
              <button data-id="xterm-int" class="sl-btn" title="Send Ctrl-C">Interrupt ⌃C</button>
              <button data-id="xterm-back" class="sl-btn" title="Leave terminal mode and return to the prompt">Back to prompt</button>
            </div>
            <div data-id="xterm-hosts" class="xterm-hosts"></div>
          </div>

          <div data-id="busy" class="busy hidden">
            <span data-id="busy-spin" class="spin-ch"></span>
            <span data-id="busy-text">Working…</span>
            <span class="dim">(<span data-id="busy-time">0s</span> · ⌘. to stop)</span>
          </div>

          <footer class="composer">
            <div data-id="ac" class="ac hidden" role="listbox"></div>
            <div data-id="prompt-line" class="prompt-line">
              <div class="prompt-row">
                <span class="prompt-glyph" data-id="prompt-glyph">❯</span>
                <div data-id="att-tray" class="att-tray hidden"></div>
                <textarea data-id="input" rows="1" spellcheck="false" autocomplete="off"></textarea>
                <button data-id="attach-btn" class="attach-btn" title="Attach files or images (you can also paste an image)">
                  <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
                </button>
              </div>
            </div>
            <div class="statusline">
              <button data-id="mode-pill" class="mode-pill" data-mode="auto">Auto</button>
              <span data-id="sl-left"></span>
              <button data-id="sl-path" class="sl-path" title="Open in Finder"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.1l1.4 1.5h5.999a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1z"/></svg><span data-id="sl-path-text"></span></button>
              <span class="grow"></span>
              <span>⇧Tab mode · Tab complete · /help</span>
              <span data-id="sl-plugins" class="sl-plugins"></span>
              <button data-id="sl-sessions" class="sl-btn sl-sessions" title="Stored sessions"></button>
              <button data-id="eof" class="sl-btn" title="Close the process's stdin (EOF)">EOF</button>
            </div>
          </footer>
        </div>
      </section>
  </template>

  <!-- embedded terminals not currently shown in a pane -->
  <div id="xterm-park" class="xterm-park" aria-hidden="true"></div>

  <!-- "New session with…" menu -->
  <div id="menu" class="menu hidden"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="themes.js"></script>
  <script src="tasks.js"></script>
  <script src="factories.js"></script>
  <script src="plugins.js"></script>
  <script src="app.js"></script>
</body>
</html>
